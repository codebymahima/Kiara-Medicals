services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiara-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Mahima@28
      DB_NAME: kiara_medicals
      JWT_SECRET: super_secure_production_jwt_secret_key_change_me
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    container_name: kiara-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Mahima@28
      MYSQL_DATABASE: kiara_medicals
    ports:
      - "3306:3306"
    volumes:
      - kiara_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/migrations/002_purchases_returns_analytics.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro
      - ./database/migrations/005_add_shop_roles.sql:/docker-entrypoint-initdb.d/04-roles.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kiara_mysql_data:
